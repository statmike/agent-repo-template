name: CI

# Runs the same universal quality & Current-State Doctrine gate (.agents/check.py)
# on every push and PR that developers and agents run locally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run quality & doctrine gates
        run: uv run python .agents/check.py
