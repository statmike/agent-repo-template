[project]
name = "agent-repo-template"
version = "0.1.0"
description = "AI Native project template"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Dev-only tooling (PEP 735). Installed by `uv sync` locally and in CI; not a
# runtime dependency of the project.
[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "pytest>=8",
]

# --- Linting & formatting: enforces the "flat, human-scannable" standard -------
[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks are runners, not logic (Golden Rule #1) — don't lint or format them as
# modules. `extend-exclude` at this level adds to ruff's built-in excludes and
# covers both the linter and the formatter; a bare `lint.exclude` would replace the
# built-ins (linting build/, dist/, …) and leave the formatter checking notebooks.
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
# A pragmatic set that pushes toward simple, typed, flat code.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import ordering)
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify (discourages needless nesting/complexity)
    "ANN",      # flake8-annotations (type hints required — CODE_STANDARDS §1)
    # Current-state hygiene (CODE_STANDARDS §5) — keeps iteration residue out of the repo.
    "ERA",      # eradicate (no commented-out code)
    "FIX",      # flake8-fixme (no inline TODO/FIXME/XXX/HACK — park them in STATUS.md)
    "ARG",      # flake8-unused-arguments (orphans from abandoned code paths)
]

[tool.ruff.lint.per-file-ignores]
# Tests may skip return-type annotations on test functions, and pytest fixtures
# are often requested for their side effects (caplog, monkeypatch) without being
# referenced in the body — that is not an orphaned argument.
"tests/**" = ["ANN", "ARG"]

# --- Type checking: strict hints on all signatures (CODE_STANDARDS §1) ---------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# Third-party GCP libs often ship incomplete stubs; don't fail on their imports.
ignore_missing_imports = true

# --- Tests --------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Makes flat modules in src/ importable by name from tests (e.g. `from bq_client
# import run_query`) without packaging or installing the project.
pythonpath = ["src"]
