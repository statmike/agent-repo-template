[project]
name = "agent-repo-template"
version = "0.1.0"
description = "AI-Native project template and multi-agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Dev-only tooling (PEP 735). Installed by `uv sync` locally and in CI; not a
# runtime dependency of the project.
[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "pytest>=8",
]

# Pin public PyPI explicitly so `uv lock` / `uv add` never bake host-specific
# corporate mirror URLs into `uv.lock`.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# --- Linting & formatting: enforces flat, human-scannable Python (.agents/rules/python.md) ---
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "ANN",      # flake8-annotations (every parameter & return type annotated)
    "ERA",      # eradicate (no commented-out code)
    "FIX",      # flake8-fixme (no inline TODO/FIXME/XXX/HACK — track in .agents/status.md)
    "ARG",      # flake8-unused-arguments
]
# Allow explicit `typing.Any` at untyped third-party / scientific library boundaries
# while still requiring annotations on every signature.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG"]

# --- Type checking: strict hints on all signatures ---
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true

# --- Tests ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = [
    "integration: tests touching live external services or credentials",
]
