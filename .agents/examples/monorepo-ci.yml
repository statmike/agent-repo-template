# Monorepo CI for one cell — copy into `<monorepo>/.github/workflows/ci-<cell>.yml`.
#
# Scenarios B and C in `.agents/README.md` delete the cell's own `.github/` folder.
# Copy this workflow to the monorepo root and replace every `path/to/cell` below.
# Works in BOTH Scenario C (`.agents/` tracked -> runs `.agents/check.py`) and
# Scenario B (`.agents/` gitignored -> runs ruff, mypy, and pytest directly).

name: CI — path/to/cell

on:
  push:
    branches: [main]
    paths:
      - "path/to/cell/**"
  pull_request:
    paths:
      - "path/to/cell/**"

defaults:
  run:
    working-directory: path/to/cell

jobs:
  cell-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          working-directory: path/to/cell
          cache-dependency-glob: uv.lock

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Quality & doctrine gates
        run: |
          if [ -f .agents/check.py ]; then
            uv run python .agents/check.py
          else
            uv run ruff check .
            uv run ruff format --check .
            if find src -name '*.py' | grep -q .; then uv run mypy src; fi
            uv run pytest || { code=$?; [ "$code" -eq 5 ] && exit 0; exit "$code"; }
          fi
